[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wulf-qt"
version = "0.1.0"
description = "Sistema de diseño Wulfenite para PySide6: superficies lacadas con canto metálico."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NoctiVulp" }]
keywords = ["pyside6", "qt", "design-system", "theme", "ui"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/wulf_qt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
