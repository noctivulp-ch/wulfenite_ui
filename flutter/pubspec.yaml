name: wulf_flutter
description: >-
  Sistema de diseño para Flutter: superficies lacadas con canto metálico,
  retícula de seis columnas y componentes que llevan sus reglas dentro.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Los iconos del sistema son SVG: Flutter no los carga de fabrica.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Los iconos viajan CON el paquete: una app que lo use no tiene que copiarlos
  # ni declararlos, solo pedirlos por nombre.
  assets:
    - assets/iconos/
